<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vantora Labs — Coming Soon</title>
  <meta name="description" content="Vantora Labs — your AI partner to solve real business problems. Launching soon.">
  <meta name="theme-color" content="#07070d">
  <link rel="icon" type="image/svg+xml" href="vantora_labs_logo_white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070d;
      --fg: #f4f4f8;
      --muted: #9a9ab0;
      --line: rgba(255, 255, 255, 0.09);
      --card: rgba(255, 255, 255, 0.035);
      --violet: #7c5cff;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---------- Background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      opacity: 0.5;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb.a { width: 42vmax; height: 42vmax; background: var(--violet); top: -18vmax; left: -10vmax; }
    .orb.b { width: 36vmax; height: 36vmax; background: var(--cyan); bottom: -20vmax; right: -10vmax; opacity: 0.3; animation-delay: -9s; }

    @keyframes drift {
      to { transform: translate(6vmax, 4vmax) scale(1.08); }
    }

    /* ---------- Layout ---------- */
    header, main, footer { position: relative; z-index: 1; }

    header {
      padding: clamp(16px, 3.5vh, 36px) clamp(16px, 4vw, 48px) 0;
      display: flex;
      justify-content: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--fg);
    }
    .brand img { width: clamp(34px, 5vh, 44px); height: auto; display: block; }
    .brand span {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 3vh, 26px);
      letter-spacing: -0.02em;
    }
    .brand span b {
      font-weight: 700;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
      gap: clamp(14px, 3.4vh, 36px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge i {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(44px, min(13vw, 12vh), 120px);
      letter-spacing: -0.045em;
      background: linear-gradient(180deg, #fff 30%, #b9b6d6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      max-width: 640px;
      font-size: clamp(15px, 2.2vh, 20px);
      line-height: 1.55;
      color: var(--muted);
    }
    .tagline strong {
      color: var(--fg);
      font-weight: 600;
    }

    /* ---------- Integration rows ---------- */
    .stack {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2.6vh, 26px);
      width: 100%;
      max-width: 860px;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(8px, 1.4vh, 14px);
    }

    .logos, .systems {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(8px, 1.4vw, 14px);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 16px 9px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      font-size: 14px;
      font-weight: 500;
      color: #d8d8e4;
      transition: transform 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    .logo svg { width: 20px; height: 20px; flex: none; }
    .logo:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.22); }
    .logo.claude:hover { color: #d97757; }
    .logo.chatgpt:hover { color: #10a37f; }
    .logo.gemini:hover { color: #4f8df5; }
    .logo.cursor:hover { color: #fff; }
    .logo.copilot:hover { color: #a78bfa; }
    .logo.mistral:hover { color: #fa520f; }
    .logo.perplexity:hover { color: #20b8cd; }

    .system {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px dashed rgba(124, 92, 255, 0.45);
      background: rgba(124, 92, 255, 0.07);
      font-size: 13px;
      font-weight: 500;
      color: #cfc8ff;
    }
    .system svg { width: 15px; height: 15px; flex: none; opacity: 0.85; }

    footer {
      padding: 0 16px clamp(14px, 3vh, 28px);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
    footer a:hover { border-color: var(--cyan); }

    /* Entrance */
    .rise { opacity: 0; transform: translateY(14px); animation: rise 0.8s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; }
    .d4 { animation-delay: .35s; } .d5 { animation-delay: .45s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* ---------- Tight viewports: keep everything on one screen ---------- */
    @media (max-width: 640px) {
      .logo { padding: 7px 12px 7px 9px; font-size: 13px; gap: 7px; }
      .logo svg { width: 17px; height: 17px; }
      .system { padding: 5px 11px; font-size: 12px; }
      .logo.copilot, .logo.perplexity { display: none; }
    }
    @media (max-height: 700px) {
      .badge { padding: 4px 12px; font-size: 11px; }
      .logo.copilot, .logo.perplexity, .logo.mistral { display: none; }
      .logo { padding: 6px 12px 6px 9px; }
      .system { padding: 4px 11px; }
      .label { font-size: 11px; }
    }
    @media (max-height: 560px) {
      .badge, .system.extra { display: none; }
      footer { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .rise { opacity: 1; transform: none; }
    }
  </style>
</head>
